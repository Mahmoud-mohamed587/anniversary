<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ember-field" id="emberField" aria-hidden="true"></div>

<button class="music-toggle" id="musicToggle" aria-label="Play music" hidden>
  <svg class="icon-note" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.4"/>
  </svg>
  <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<audio id="bgMusic" loop preload="none"></audio>

<main id="app">

  <!-- ================= LANDING ================= -->
  <section class="screen" id="screen-landing" data-screen>
    <div class="screen-inner landing-inner">
      <p class="eyebrow-mark" id="landingKicker">a story between</p>
      <h1 class="names" id="landingNames">
        <span id="nameA">—</span>
        <span class="names-and">&amp;</span>
        <span id="nameB">—</span>
      </h1>
      <p class="opening-message" id="openingMessage"></p>

      <div class="countdown" id="landingCountdown" aria-live="polite">
        <p class="countdown-label" id="landingCountdownLabel">counting to our anniversary</p>
        <div class="countdown-units">
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="days">00</span>
            <span class="countdown-word">days</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="hours">00</span>
            <span class="countdown-word">hrs</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="minutes">00</span>
            <span class="countdown-word">min</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="seconds">00</span>
            <span class="countdown-word">sec</span>
          </div>
        </div>
      </div>

      <button class="btn-next" data-next>
        <span>Begin our story</span>
        <svg viewBox="0 0 20 10" width="20" height="10"><path d="M0 5H19M19 5L14 1M19 5L14 9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ================= LETTER ================= -->
  <section class="screen" id="screen-letter" data-screen hidden>
    <div class="screen-inner letter-inner">
      <p class="eyebrow-mark">a little message for you</p>
      <div class="letter-paper" id="letterBody"></div>
      <button class="btn-next" data-next>
        <span>Continue</span>
        <svg viewBox="0 0 20 10" width="20" height="10"><path d="M0 5H19M19 5L14 1M19 5L14 9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ================= STORY (MONTH BY MONTH) ================= -->
  <section class="screen" id="screen-story" data-screen hidden>
    <div class="screen-inner story-inner">

      <div class="chapter-progress" id="chapterProgress" role="list" aria-label="Story chapters"></div>

      <header class="chapter-header">
        <p class="eyebrow-mark" id="chapterKicker">chapter</p>
        <h2 class="chapter-title" id="chapterTitle">—</h2>
        <p class="chapter-description" id="chapterDescription"></p>
      </header>

      <div class="timeline" id="timeline"></div>

      <button class="btn-next" data-next id="storyNextBtn">
        <span>Next</span>
        <svg viewBox="0 0 20 10" width="20" height="10"><path d="M0 5H19M19 5L14 1M19 5L14 9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ================= ENDING / ANNIVERSARY ================= -->
  <section class="screen" id="screen-ending" data-screen hidden>
    <div class="screen-inner ending-inner">
      <p class="unfinished-line" id="unfinishedLine">Our story isn&rsquo;t finished yet&hellip;</p>

      <p class="eyebrow-mark">our anniversary</p>
      <p class="anniversary-date" id="anniversaryDateLabel">—</p>

      <div class="countdown" id="endingCountdown" aria-live="polite">
        <div class="countdown-units">
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="days">00</span>
            <span class="countdown-word">days</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="hours">00</span>
            <span class="countdown-word">hrs</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="minutes">00</span>
            <span class="countdown-word">min</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" data-unit="seconds">00</span>
            <span class="countdown-word">sec</span>
          </div>
        </div>
      </div>

      <button class="btn-ghost" id="replayBtn">Read our story again</button>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
